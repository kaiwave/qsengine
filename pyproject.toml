[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "qsengine"
description = "A fast state-vector quantum simulator for Python, with a Rust core that runs on any CPU or GPU"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["numpy>=1.19"]
license-files = ["LICENSE"]
authors = [{ name = "kaiwave" }]
keywords = ["quantum", "quantum computing", "simulator", "statevector", "qubit", "gpu", "rust"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dynamic = ["version"]   # taken from Cargo.toml

[project.urls]
Homepage = "https://qsengine.kaiwave.dev"
Documentation = "https://qsengine.kaiwave.dev/docs/"
Source = "https://github.com/kaiwave/qsengine"
Issues = "https://github.com/kaiwave/qsengine/issues"
"Release notes" = "https://qsengine.kaiwave.dev/docs/release-notes/"

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
# Build the Rust crate with its Python bindings (and the default GPU backend).
features = ["python"]
