# Builds qsengine wheels for every supported platform, tests each one, and publishes
# them to PyPI when a version tag (v1.0.0, v1.0.1, ...) is pushed.
#
# Pull requests and manual runs build and test but never publish.
# Publishing uses PyPI Trusted Publishing: no API token is stored in the repository.
# (Based on `maturin generate-ci github`, trimmed to the platforms qsengine supports.)

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
      # aarch64 is cross-compiled on an x86 runner, so only the x86_64 wheel can be run here.
      - name: Test the wheel
        if: matrix.target == 'x86_64'
        run: |
          # numpy first: --no-index (which makes sure we test this wheel, not PyPI's) can't fetch dependencies.
          pip install pytest numpy
          pip install qsengine --no-index --find-links dist --force-reinstall
          pytest

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist
      - name: Test the wheel
        shell: bash
        run: |
          # numpy first: --no-index (which makes sure we test this wheel, not PyPI's) can't fetch dependencies.
          pip install pytest numpy
          pip install qsengine --no-index --find-links dist --force-reinstall
          pytest

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
      - name: Test the wheel
        run: |
          # numpy first: --no-index (which makes sure we test this wheel, not PyPI's) can't fetch dependencies.
          pip install pytest numpy
          pip install qsengine --no-index --find-links dist --force-reinstall
          pytest

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Refuse to release v1.2.3 if Cargo.toml says anything other than 1.2.3.
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    # Must match the environment named in PyPI's Trusted Publishing settings.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
