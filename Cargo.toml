[package]
name = "qsengine"
version = "0.1.0"
edition = "2024"
description = "High-performance state-vector quantum simulator (CPU + portable GPU backends)"

[lib]
# `rlib` for Rust users and the demo binary. When the PyO3 layer is added,
# append "cdylib" here so maturin can build a Python extension module.
crate-type = ["rlib"]

[features]
# The GPU backend is on by default but optional: build with
# `--no-default-features` on machines/toolchains where wgpu is unwanted.
# Even when compiled in, it is only used if a GPU adapter is found at runtime.
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
num-complex = "0.4.6"
rand = "0.9"
rayon = "1.10"

wgpu = { version = "25", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
